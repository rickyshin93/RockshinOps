<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>RockshinOps</title>
    <link rel="icon" type="image/svg+xml" href="/resources/logo.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
    THESIS: A coherent native monitoring workspace: compact readings and grouped tools replace oversized empty landing pages.
    OWN-WORLD: System blue actions, light neutral canvas, white panels, system typography, 16px grids and 20px panel padding; a white R monogram with a green brand dot on a blue tile identifies RockshinOps. Tailwind CSS v4 owns shared tokens and components.
    STORY: Overview -> hardware/process/connection details -> return to the persistent disk-capacity menu bar.
    FIRST VIEWPORT: Left navigation below native traffic lights; right overview grid with period/pause controls inside the content. No standalone top bar or centered window title.
    FORM: Operate mode, code-led, agent-selected refinement of the existing macOS identity. Every reading comes from the local system; unavailable values and unrecorded history stay explicit.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div class="app-shell flex h-dvh min-h-0 overflow-hidden">
      <aside class="sidebar" aria-label="RockshinOps">
        <div class="window-drag" aria-hidden="true"></div>
        <div class="brand-row"><img src="/resources/logo.svg" width="28" height="28" alt="" /><span class="brand-wordmark" aria-label="RockshinOps"><span aria-hidden="true">Rockshin<span class="brand-wordmark-ops">Ops</span></span></span></div>
        <nav id="navigation" aria-label="RockshinOps"></nav>
        <div class="sidebar-footer">
          <span id="device-mark" class="device-mark" aria-hidden="true"></span>
          <div><strong id="machine-name">RockshinOps</strong><p id="machine-detail"></p></div>
        </div>
      </aside>
      <main class="main-panel flex h-full min-h-0 min-w-0 flex-1 flex-col overflow-hidden bg-bg">
        <div class="main-drag-strip" aria-hidden="true"></div>
        <div class="content-scroll" id="content-scroll">
          <div class="page-heading">
            <div class="page-title"><h1 id="page-title"></h1><p id="page-subtitle"></p></div>
            <div class="page-tools">
              <div id="page-filters" class="page-filters" hidden></div>
              <div id="page-actions" class="page-actions"></div>
            </div>
          </div>
          <div id="connection-error" class="notice error" role="alert" hidden></div>
          <div id="page-body" aria-busy="true"><div class="empty-state"><span class="loading-dot"></span></div></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
