name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: darwin/arm64
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: darwin/amd64
            artifact: macos-amd64
          - name: Windows x86_64
            runner: windows-2025
            target: windows/amd64
            artifact: windows-amd64
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: linux/amd64
            artifact: linux-amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun scripts/check-release.ts "$GITHUB_REF_NAME"
      - name: Go tests
        run: sh scripts/go.sh test -v ./...
      - name: Frontend tests
        run: bun run test:web
      - name: Build application and installer
        run: sh scripts/mygo.sh build -platform "${{ matrix.target }}"
      - name: Check generated bindings
        run: git diff --exit-code -- src/mygo.ts
      - name: Collect release files
        run: bun scripts/collect-release.ts "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: localops-${{ matrix.artifact }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: localops-*
          path: release-files
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LocalOps $GITHUB_REF_NAME" \
            --notes-file ../.github/RELEASE_NOTES.md
