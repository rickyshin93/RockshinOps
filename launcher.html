<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>RockshinOps Launcher</title>
    <link rel="stylesheet" href="/src/launcher.css" />
  </head>
  <body>
    <div id="launcher" class="launcher">
      <div class="launcher-search">
        <svg class="launcher-glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="launcher-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="launcher-results" aria-autocomplete="list" />
      </div>
      <ul id="launcher-results" class="launcher-results" role="listbox" hidden></ul>
      <p id="launcher-empty" class="launcher-empty" hidden></p>
    </div>
    <script type="module" src="/src/launcher.ts"></script>
  </body>
</html>
